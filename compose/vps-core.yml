# VM core.
# Prefect server, Postgres (mart Gold), FastAPI read-only, dan Metabase.
# Prometheus, Grafana, Loki, Caddy, dan Authelia belum ditambahkan.
services:
  prefect-server:
    profiles: ["full", "demo"]
    image: prefecthq/prefect:3-latest
    container_name: karhutla-prefect-server
    restart: unless-stopped
    # Root dipakai supaya volume SQLite bisa ditulis tanpa mengatur izin dulu.
    # Ganti ke user prefect kalau nanti sudah memakai Postgres.
    user: "0:0"
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_UI_API_URL: http://127.0.0.1:4200/api
      PREFECT_SERVER_DATABASE_CONNECTION_URL: sqlite+aiosqlite:////var/lib/prefect/prefect.db
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "4200:4200"
    volumes:
      - prefect-data:/var/lib/prefect
    networks:
      - karhutla
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=5).status == 200 else 1)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    profiles: ["full"]
    image: postgres:16-alpine
    container_name: karhutla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-karhutla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karhutla}
      POSTGRES_DB: ${POSTGRES_DB:-karhutla}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - karhutla
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: karhutla-api
    restart: unless-stopped
    environment:
      GOLD_PUBLISH_ROOT: /app/data/gold/published
      ICEBERG_ROOT: /app/data/gold/_iceberg
      GOLD_CATALOG_ROOT: /app/data/gold/_catalog
      AUTH_URL: ${AUTH_URL:-}
      GRAFANA_URL: ${GRAFANA_URL:-}
      METABASE_URL: ${METABASE_URL:-}
      PREFECT_URL: ${PREFECT_URL:-}
      METABASE_DASHBOARD_URL: ${METABASE_DASHBOARD_URL:-}
      DATABASE_DSN: dbname=${POSTGRES_DB:-karhutla} user=${POSTGRES_USER:-karhutla} password=${POSTGRES_PASSWORD:-karhutla} host=postgres port=5432
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data:ro
    networks:
      - karhutla
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  metabase:
    profiles: ["full", "demo"]
    mem_limit: 1500m
    image: metabase/metabase:latest
    container_name: karhutla-metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      MB_SITE_URL: ${METABASE_SITE_URL:-http://localhost:3000}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "3000:3000"
    volumes:
      - metabase-data:/metabase-data
    networks:
      - karhutla
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prefect-data:
    name: karhutla-prefect-data
  postgres-data:
    name: karhutla-postgres-data
  metabase-data:
    name: karhutla-metabase-data

networks:
  karhutla:
    name: karhutla
