# Node batch: Garage (object storage), garage-webui (browser), dan consumer FIRMS.
#
# Kredensial diambil dari `.env` di root repo (gitignored). File itu berisi
# GARAGE_DEFAULT_ACCESS_KEY / GARAGE_DEFAULT_SECRET_KEY yang dipakai Garage saat
# start dengan --default-bucket.
#
# Jalankan dari root repo:
#   docker compose -f compose/base.yml -f compose/vps-batch.yml up -d
#
# Web UI: http://localhost:3909
# S3 API: http://localhost:3900   (path-style, region "garage")
#
# Service stream (redpanda) tidak didefinisikan di sini karena hidup di node lain.
# Di lokal, jalankan `just dev` (stream) lalu `just up-batch`; keduanya memakai
# network yang sama dari compose/base.yml sehingga consumer bisa menjangkau
# redpanda. Di VM asli, REDPANDA_BROKERS=stream:9092 lewat Tailscale.
#
# Consumer tidak punya depends_on ke redpanda (service itu tidak ada di file ini),
# tapi bergantung pada Garage yang sehat.

services:
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: karhutla-garage
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "3900:3900"   # S3 API
      - "3901:3901"   # RPC (single node)
      - "3902:3902"   # s3_web (website hosting, bukan browser)
      - "3903:3903"   # admin API + metrics
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - karhutla
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  garage-webui:
    image: khairul169/garage-webui:latest
    container_name: karhutla-garage-webui
    restart: unless-stopped
    depends_on:
      garage:
        condition: service_healthy
    volumes:
      # webui membaca admin_token dan rpc_public_addr dari file yang sama.
      - ../infra/garage/garage.toml:/etc/garage.toml:ro
    environment:
      API_BASE_URL: http://garage:3903
      S3_ENDPOINT_URL: http://garage:3900
      S3_REGION: garage
      AUTH_USER_PASS: ${GARAGE_WEBUI_AUTH:-}
    ports:
      - "3909:3909"
    networks:
      - karhutla
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    image: karhutla/firms-consumer:local
    container_name: karhutla-firms-consumer
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      garage:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
    environment:
      # Menimpa nilai .env yang berorientasi host.
      DATA_DIR: /app/data
      BRONZE_SINK: ${BRONZE_SINK:-garage}
      BRONZE_PREFIX_FIRMS: ${BRONZE_PREFIX_FIRMS:-bronze/firms}
      GARAGE_ENDPOINT: http://garage:3900
      GARAGE_BUCKET: lakehouse
      GARAGE_FORCE_PATH_STYLE: "true"
      REDPANDA_BROKERS: ${REDPANDA_BROKERS:-redpanda:9092}
      REDPANDA_TOPIC: ${REDPANDA_TOPIC:-firms.hotspot.raw}
      REDPANDA_DLQ_TOPIC: ${REDPANDA_DLQ_TOPIC:-firms.hotspot.dlq}
      CONSUMER_GROUP: ${CONSUMER_GROUP:-bronze-firms}
      CONSUMER_FLUSH_SECONDS: ${CONSUMER_FLUSH_SECONDS:-60}
      CONSUMER_MAX_EVENTS: ${CONSUMER_MAX_EVENTS:-5000}
      METRICS_PORT: "9102"
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "127.0.0.1:9102:9102"   # /metrics consumer
    volumes:
      # Hanya untuk state watermark dan fallback BRONZE_SINK=local.
      - ../data/batch:/app/data
    networks:
      - karhutla
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Consumer menulis heartbeat tiap 30 detik, termasuk saat topik idle.
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sys,time;
          p='/app/data/state/consumer_heartbeat.json';
          sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 300 else 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: ["python", "stream/src/consumer.py"]

  prefect-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    image: karhutla/python:local
    container_name: karhutla-prefect-worker
    restart: unless-stopped
    depends_on:
      garage:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
    environment:
      # Alamat dari dalam jaringan compose, bukan dari host.
      PREFECT_API_URL: http://core:4200/api
      GARAGE_ENDPOINT: http://garage:3900
      GARAGE_FORCE_PATH_STYLE: "true"
      BURNED_AREA_BBOX: ${BURNED_AREA_BBOX:-95,-11,141,6}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      # Kode di-mount supaya perubahan flow tidak perlu build ulang.
      - ../:/app
    networks:
      - karhutla
    # Pool dibuat terpisah lewat `task prefect-pool`.
    command: ["prefect", "worker", "start", "--pool", "default"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  garage-meta:
    name: karhutla-garage-meta
  garage-data:
    name: karhutla-garage-data

# Dideklarasikan di sini supaya file ini tetap valid tanpa compose/base.yml.
networks:
  karhutla:
    name: karhutla
