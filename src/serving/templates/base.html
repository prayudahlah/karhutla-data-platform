<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}JAGAHUTAN{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/static/portal.css">
</head>
<body>
<header class="site-header">
  <nav class="site-nav">
    <a class="brand" href="/">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FF8A3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/></svg>
      JAGAHUTAN
    </a>
    <div class="navlinks">
      <a href="/" class="{{ 'on' if active == 'ringkasan' }}">Ringkasan</a>
      <a href="/catalog" class="{{ 'on' if active == 'katalog' }}">Katalog</a>
      <a href="/lineage" class="{{ 'on' if active == 'lineage' }}">Lineage</a>
      <a href="/docs">API</a>
    </div>
    <div class="nav-actions">
      <a class="navbtn navbtn-primary" href="{{ dashboard_url }}">Dashboard</a>
      {% if user %}
        <span class="nav-user mono" title="Masuk sebagai {{ user }}{% if role %} ({{ role }}){% endif %}">{{ user }}</span>
        <a class="navbtn" href="{{ logout_url }}">Keluar</a>
      {% else %}
        <a class="navbtn navbtn-strong" href="{{ auth_url or '/#masuk' }}">Masuk SSO</a>
      {% endif %}
    </div>
  </nav>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <span>JAGAHUTAN / Kelompok 8 / DABD 2026</span>
  <span class="footer-nav">
    <a href="/catalog">Katalog</a> /
    <a href="/lineage">Lineage</a> /
    <a href="/docs">Dokumentasi API</a>
  </span>
  <span class="footer-note">Bersifat indikatif, bukan peringatan resmi</span>
</footer>
</body>
</html>
