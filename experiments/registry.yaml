  rule: delta PR-AUC valid >= -0.002 dan stabilitas koefisien lebih baik
  delta_valid_pr_auc: -0.0019
  sd_province_c1: 0.2525
  sd_province_c10: 0.4237
  sd_n_hotspot_c1: 0.0709
  sd_n_hotspot_c10: 0.0726
  bootstrap_resamples: 200
  result: 'C=1 menjadi konfigurasi kerja. Test 19-23 September tetap milik C=10 (0,6311)
    dan tidak diklaim untuk C=1. Evaluasi C=1 menunggu jendela baru.

    '
