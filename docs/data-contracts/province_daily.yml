name: province_daily
owner: Kelompok 8 - Batch
layer: gold
status: implemented
location:
  storage: Garage (S3-compatible)
  bucket: lakehouse
  prefix: gold/province_daily
  pattern: date=YYYY-MM-DD/*.parquet
  publish:
    materialization: external parquet (dbt-duckdb)
    local_root: data/gold/published/province_daily
    uploader: null
  partition_note: Satu partisi per tanggal, ditimpa penuh setiap build.
source_models:
  - cell_daily
  - int_weather_daily_province
  - int_air_quality_daily_province
  - int_scar_province_daily
grain: Satu baris per provinsi per tanggal.
business_key:
  - province
  - date
deduplication:
  key: [province, date]
  status: dijamin oleh group by province, date
schema:
  province: {type: string}
  date: {type: date}
  hotspot_count: {type: integer}
  hotspot_kuat: {type: integer}
  hotspot_sedang: {type: integer}
  hotspot_lemah: {type: integer}
  hotspot_kandidat: {type: integer}
  active_cells: {type: integer, description: jumlah sel dengan hotspot > 0}
  frp_sum: {type: double}
  frp_mean: {type: double}
  frp_max: {type: double, nullable: true}
  scar_pixels_cum: {type: integer, description: piksel scar kumulatif per provinsi}
  scar_area_km2_cum: {type: double}
  temp_max: {type: double, nullable: true}
  rh_min: {type: double, nullable: true}
  precip_sum: {type: double, nullable: true}
  wind_speed_max: {type: double, nullable: true}
  vpd_max: {type: double, nullable: true}
  weather_hours: {type: integer}
  weather_complete: {type: boolean}
  pm25_mean: {type: double, nullable: true}
  pm25_max: {type: double, nullable: true}
  freshness_at: {type: timestamp, description: ingested_at terbaru hotspot provinsi itu}

freshness:
  expected: mengikuti build Gold harian
  alert_threshold: tidak ada baris baru lebih dari 26 jam
  measured_by: freshness_at

retention: mengikuti Silver; bisa dibangun ulang dari cell_daily.
classification: public
quality_rules:
  - (province, date) unik
  - total hotspot_count semua provinsi = 486.238
  - total per tier sama dengan Silver (kuat 45.869, sedang 17.969, lemah 11.531, kandidat 410.869)
  - total scar kumulatif akhir = 36.916 piksel
  - weather_complete konsisten dengan weather_hours >= 20
consumers:
  - FastAPI read-only
  - dashboard Metabase
  - laporan harian
