name: hotspot_scar_label
owner: Kelompok 8 - Yuda
layer: silver
status: skeleton
location:
  storage: Garage (S3-compatible)
  bucket: lakehouse
  prefix: silver/hotspot_scar_label
  pattern: date=YYYY-MM-DD/part-00000.parquet
grain: Satu baris per hotspot dengan label scar terdekat.
schema:
  event_id: {type: string}
  tile: {type: string, nullable: true}
  row: {type: integer, nullable: true}
  col: {type: integer, nullable: true}
  burn_date: {type: date, nullable: true}
  gap_days: {type: integer, nullable: true}
  tier: {type: string, nullable: true}
  latitude: {type: double}
  longitude: {type: double}
  acq_ts_utc: {type: timestamp}
freshness:
  expected: mengikuti pembaruan FIRMS dan MCD64A1
  alert_threshold: belum ditetapkan
retention: mengikuti kebijakan Silver
classification: public
quality_rules:
  - event_id unik
  - gap_days tidak negatif bila burn_date tersedia
  - tier mengikuti aturan sql/silver/burn_scar_tiers.sql
consumers:
  - gold_risk_grid
  - fitur model
