name: open_meteo_weather
owner: Kelompok 8 - Aulia
layer: silver
status: implemented
location:
  storage: Garage (S3-compatible)
  bucket: lakehouse
  prefix: silver/open_meteo/dataset=weather
  pattern: date=YYYY-MM-DD/part-00000.parquet
source:
  bronze_layouts:
    - bronze/open_meteo/weather/ingest_date=.../run_id=.../*.json
    - bronze/open_meteo/dataset=weather/ingest_date=.../run_id=.../*.json
  location_level: province
grain: Satu baris per provinsi, kota, dan jam setelah dedup.
schema:
  date: {type: date, description: Partisi tanggal UTC dari ts_utc}
  province: {type: string}
  city: {type: string}
  latitude: {type: double}
  longitude: {type: double}
  ts_utc: {type: timestamp}
  ts_local: {type: timestamp}
  run_id: {type: string}
  ingestion_timestamp: {type: timestamp}
  temperature_2m: {type: double, nullable: true}
  relative_humidity_2m: {type: double, nullable: true}
  precipitation: {type: double, nullable: true}
  wind_speed_10m: {type: double, nullable: true}
  wind_direction_10m: {type: double, nullable: true}
  soil_moisture_0_to_7cm: {type: double, nullable: true}
  vapour_pressure_deficit: {type: double, nullable: true}
  et0_fao_evapotranspiration: {type: double, nullable: true}
  units_json: {type: string, description: Salinan hourly_units dari respons Open-Meteo}
freshness:
  expected: harian
  alert_threshold: belum ditetapkan
retention: mengikuti kebijakan Silver
classification: public
quality_rules:
  - Kunci (province, city, ts_utc) unik setelah dedup dbt.
  - Setiap lokasi memiliki 24 jam per tanggal lokal.
  - Jumlah baris cocok dengan record_count Bronze; selisih dijelaskan di DQ.
  - Variabel wajib yang hilang atau panjangnya beda membuat objek masuk karantina.
  - Variabel tambahan diabaikan dan dicatat di laporan DQ.
  - Objek city-level di luar scope province di-skip dan dicatat jumlahnya.
  - Dedup memilih ingestion_timestamp terbaru, lalu run_id terbesar.
consumers:
  - gold_risk_grid
  - fitur model
