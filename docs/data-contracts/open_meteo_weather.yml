name: open_meteo_weather
owner: Kelompok 8 - Aulia
layer: silver
status: skeleton
location:
  storage: Garage (S3-compatible)
  bucket: lakehouse
  prefix: silver/open_meteo/dataset=weather
  pattern: date=YYYY-MM-DD/part-00000.parquet
grain: Satu baris per provinsi, kota, dan jam.
schema:
  province: {type: string}
  city: {type: string}
  latitude: {type: double}
  longitude: {type: double}
  ts_utc: {type: timestamp}
  ts_local: {type: timestamp, nullable: true}
  run_id: {type: string}
  ingestion_timestamp: {type: timestamp}
  temperature_2m: {type: double, nullable: true}
  relative_humidity_2m: {type: double, nullable: true}
  precipitation: {type: double, nullable: true}
  wind_speed_10m: {type: double, nullable: true}
  wind_direction_10m: {type: double, nullable: true}
  soil_moisture_0_to_7cm: {type: double, nullable: true}
  vapour_pressure_deficit: {type: double, nullable: true}
  et0_fao_evapotranspiration: {type: double, nullable: true}
  units_json: {type: string, description: Salinan hourly_units dari respons Open-Meteo}
freshness:
  expected: harian
  alert_threshold: belum ditetapkan
retention: mengikuti kebijakan Silver
classification: public
quality_rules:
  - kunci provinsi, kota, dan ts_utc unik setelah dedup
  - setiap lokasi memiliki 24 jam per tanggal lokal
  - jumlah baris cocok dengan record_count Bronze
  - variabel di luar daftar yang diharapkan masuk karantina
consumers:
  - gold_risk_grid
  - fitur model
