name: ci

on:
  # dev adalah jalur integrasi: setiap PR ke sana harus diuji, bukan hanya main.
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -e ".[dev]"
          # Tes unit menyentuh kode node stream, yang dependensinya dipisah
          # karena image-nya sendiri (lihat docker/Dockerfile.stream).
          pip install -r stream/requirements.txt

      - name: Lint
        run: ruff check .

      - name: Test dan coverage
        run: pytest --cov=src --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
