name: ci

on:
  # dev adalah jalur integrasi: setiap PR ke sana harus diuji, bukan hanya main.
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -e ".[dev,silver]"
          # Tes unit menyentuh kode node stream, yang dependensinya dipisah
          # karena image-nya sendiri (lihat docker/Dockerfile.stream).
          pip install -r stream/requirements.txt

      - name: Lint
        run: ruff check .

      - name: Test dan coverage
        run: pytest --cov=src --cov-report=xml

      - name: dbt build
        env:
          DBT_DUCKDB_PATH: ":memory:"
          SILVER_NORMALIZED_ROOT: "tests/fixtures/silver/_normalized"
          SILVER_PUBLISH_ROOT: "data/silver/published"
        run: |
          cp dbt/profiles.yml.example dbt/profiles.yml
          python -m batch.silver.prepare
          dbt build --project-dir dbt --profiles-dir dbt --target ci

      - name: Pastikan hasil dbt berupa parquet
        run: |
          count=$(find data/silver/published -name '*.parquet' | wc -l)
          echo "berkas parquet: $count"
          test "$count" -gt 0

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
