version: 2

models:
  - name: cell_daily
    description: >-
      Gold fact table, satu baris per sel grid 0,25 derajat per hari. Berisi
      agregat hotspot (beserta tier), scar kumulatif, cuaca dan kualitas udara
      harian provinsi, serta label risiko D..D+2 untuk melatih model.
    columns:
      - name: cell_id
        description: Indeks sel grid 0,25 derajat (rrrr_cccc).
        data_tests: [not_null]
      - name: date
        description: Tanggal fitur, memakai acq_date hotspot.
        data_tests: [not_null]
      - name: province
        description: Provinsi dari centroid provinsi terdekat.
        data_tests: [not_null]
      - name: cell_lat
        data_tests: [not_null]
      - name: cell_lon
        data_tests: [not_null]
      - name: hotspot_count
        data_tests: [not_null]
      - name: label_risk
        description: 1 bila ada hotspot tier kuat/sedang pada D..D+2.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: label_complete
        description: False untuk dua tanggal terakhir, jendela label belum penuh.
        data_tests: [not_null]
      - name: weather_complete
        description: True bila weather_hours >= 20.
        data_tests: [not_null]

  - name: gold_hotspot_cell_day
    description: >
      Satu baris per sel 0,25° per hari, berisi label biner kebakaran
      terkonfirmasi dan agregat deteksi hotspot. Sumber dataset ML.
    columns:
      - name: cell_id
        description: "Indeks grid 0,25° dalam bentuk {cell_y}_{cell_x}."
        data_tests: [not_null]
      - name: cell_y
        data_tests: [not_null]
      - name: cell_x
        data_tests: [not_null]
      - name: center_lat
        data_tests: [not_null]
      - name: center_lon
        data_tests: [not_null]
      - name: date
        data_tests: [not_null]
      - name: n_hotspot
        description: Jumlah deteksi hotspot dalam sel-hari.
        data_tests: [not_null]
      - name: label
        description: "1 = ada hotspot kuat/sedang; 0 = hanya lemah/kandidat."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: label_complete
        description: >
          True bila semua tile yang disentuh sudah punya cakupan burn scar
          pada rentang tanggal -7 sampai +7 hari.
        data_tests: [not_null]
      - name: audit_tier_max
        data_tests:
          - accepted_values:
              arguments:
                values: ['kuat', 'sedang', 'lemah', 'kandidat']

  - name: mcd64a1_coverage
    description: Satu baris per tile dan periode yang sudah diurai.
    columns:
      - name: period
        data_tests: [not_null]
      - name: tile
        data_tests: [not_null]

  - name: int_hotspot_cell_daily
    description: Agregat hotspot per sel per hari sebelum digabung ke cell_daily.
    columns:
      - name: cell_id
        data_tests: [not_null]
      - name: date
        data_tests: [not_null]

  - name: int_weather_daily_province
    description: Cuaca harian per provinsi, termasuk jumlah jam teramati.
    columns:
      - name: province
        data_tests: [not_null]
      - name: date
        data_tests: [not_null]

  - name: int_air_quality_daily_province
    description: Kualitas udara harian per provinsi.
    columns:
      - name: province
        data_tests: [not_null]
      - name: date
        data_tests: [not_null]

  - name: int_cell_daily_universe
    description: Semesta sel x tanggal dengan label risiko D..D+2.
    columns:
      - name: cell_id
        data_tests: [not_null]
      - name: date
        data_tests: [not_null]

  - name: int_scar_cell_daily
    description: Scar kumulatif dan 30 hari per sel per hari.
    columns:
      - name: cell_id
        data_tests: [not_null]
      - name: date
        data_tests: [not_null]

  - name: province_daily
    description: >-
      Gold mart, satu baris per provinsi per hari. Dipakai dashboard untuk
      jumlah hotspot per tier, tren FRP, scar kumulatif, cuaca, dan kualitas
      udara.
    columns:
      - name: province
        data_tests: [not_null]
      - name: date
        data_tests: [not_null]
      - name: hotspot_count
        data_tests: [not_null]
      - name: weather_complete
        data_tests: [not_null]
      - name: scar_pixels_cum
        data_tests: [not_null]

  - name: burn_scar_monthly
    description: >-
      Gold mart, luas terbakar per provinsi per bulan. Total piksel harus sama
      dengan mcd64a1_burn_scar.
    columns:
      - name: burn_month
        data_tests: [not_null]
      - name: province
        data_tests: [not_null]
      - name: scar_pixels
        data_tests: [not_null]
      - name: scar_area_km2
        data_tests: [not_null]

  - name: int_scar_province_daily
    description: Scar kumulatif per provinsi per hari dari semua piksel scar.
    columns:
      - name: province
        data_tests: [not_null]
      - name: date
        data_tests: [not_null]
