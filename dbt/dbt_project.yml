name: karhutla
version: "1.0.0"
config-version: 2

profile: karhutla

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets:
  - target
  - dbt_packages

models:
  karhutla:
    +materialized: view
    gold:
      +tags: ['gold']

vars:
  silver_publish_root: "{{ env_var('SILVER_PUBLISH_ROOT', 'data/silver/published') }}"
  gold_publish_root: "{{ env_var('GOLD_PUBLISH_ROOT', 'data/gold/published') }}"
  provinces_csv: "resources/indonesia_provinces.csv"
