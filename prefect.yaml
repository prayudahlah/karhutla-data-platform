# Deployment Prefect untuk ingestion batch.
#
# Daftarkan dengan (butuh server Prefect yang bisa dijangkau):
#   prefect deploy --all
#
# Tanpa server, flow tetap bisa dijalankan manual:
#   python -m flows.openmeteo_ingestion --limit 2

deployments:
  - name: open-meteo-bronze-daily
    description: Ingest Open-Meteo weather + air quality ke Garage Bronze
    entrypoint: flows/openmeteo_ingestion.py:daily_ingestion
    schedules:
      - cron: "0 2 * * *"
        timezone: Asia/Jakarta
    work_pool:
      name: default
    parameters:
      limit: null

  - name: mcd64a1-bronze-monthly
    description: Ingest MCD64A1 burned area ke Garage Bronze
    entrypoint: flows/burned_area_ingestion.py:monthly_ingestion
    schedules:
      - cron: "0 6 5 * *"
        timezone: Asia/Jakarta
    work_pool:
      name: default
    parameters: {}
