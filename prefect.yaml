# Deployment Prefect untuk ingestion batch.
#
# Daftarkan dengan (butuh server Prefect yang bisa dijangkau):
#   prefect deploy --all
#
# Tanpa server, flow tetap bisa dijalankan manual:
#   python -m flows.openmeteo_ingestion --limit 2

deployments:
  - name: open-meteo-bronze-daily
    description: Ingest Open-Meteo weather + air quality ke Garage Bronze
    entrypoint: flows/openmeteo_ingestion.py:daily_ingestion
    schedules:
      - cron: "0 2 * * *"
        timezone: Asia/Jakarta
    work_pool:
      name: default
    parameters:
      limit: null

  - name: mcd64a1-bronze-monthly
    description: Ingest MCD64A1 burned area ke Garage Bronze
    entrypoint: flows/burned_area_ingestion.py:monthly_ingestion
    schedules:
      - cron: "0 6 5 * *"
        timezone: Asia/Jakarta
    work_pool:
      name: default
    parameters: {}

  # Training temporal sengaja manual: Gold dibangun ulang di luar jadwal ini,
  # dan test 19-23 September 2026 sudah seen. Jalankan lewat UI Prefect atau
  # `prefect deployment run`.
  - name: ml-temporal-training
    description: Latih LR dan LightGBM temporal dari fitur Gold via Feast, catat ke MLflow
    entrypoint: flows/ml_training.py:training_pipeline
    work_pool:
      name: default
    parameters:
      model_configs: null
      promote: false
      mlflow_required: true
