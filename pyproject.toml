[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karhutla-data-platform"
version = "0.1.0"
description = "Karhutla data platform skeleton"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.36",
    "confluent-kafka>=2.5",
    "duckdb>=1.1",
    "httpx>=0.27",
    "prefect>=3.0,<4",
    "prometheus-client>=0.20",
    "pyarrow>=17",
]

[project.optional-dependencies]
dlt = [
    "dlt[s3]>=1.0",
]
silver = [
    "dbt-duckdb>=1.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "pre-commit>=3.8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "stream/src"]
markers = [
    "integration: tests that require a live Garage/S3-compatible endpoint",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
# Notebook tidak ikut lint: sel Colab berisi kode eksplorasi, bukan kode aplikasi.
extend-exclude = ["stream/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
