[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karhutla-data-platform"
version = "0.1.0"
description = "Karhutla data platform skeleton"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.36",
    "confluent-kafka>=2.5",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "httpx>=0.27",
    "prefect>=3.0,<4",
    "prometheus-client>=0.20",
    "pyarrow>=17",
    "pyhdf>=0.11",
    "pyiceberg[s3fs,sql-sqlite]>=0.12",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dlt = [
    "dlt[s3]>=1.0",
]
silver = [
    "dbt-duckdb>=1.8",
]
ml = [
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "mlflow>=2.17,<3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]
feast = [
    "feast[duckdb]>=0.68,<0.69",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "ruff>=0.7",
    "pre-commit>=3.8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "stream/src", "."]
markers = [
    "integration: tests that require a live Garage/S3-compatible endpoint",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
# Notebook tidak ikut lint: sel Colab berisi kode eksplorasi, bukan kode aplikasi.
extend-exclude = ["stream/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI memakai Query/Depends di default argumen; pola ini memang idiomatik.
"src/serving/**/*.py" = ["B008"]
